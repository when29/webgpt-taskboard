<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">A little room for focus</p><h1>Taskboard</h1></header>
    <form id="task-form">
      <label for="task-title">What needs doing?</label>
      <div class="entry"><input id="task-title" name="title" required maxlength="200" autocomplete="off"><button>Add task</button></div>
    </form>
    <div class="filters" role="group" aria-label="할 일 필터">
      <button type="button" data-filter="all" aria-pressed="true">전체</button>
      <button type="button" data-filter="active" aria-pressed="false">진행 중</button>
      <button type="button" data-filter="completed" aria-pressed="false">완료</button>
    </div>
    <p id="summary" aria-live="polite"></p>
    <div class="task-actions">
      <button id="clear-completed" class="clear-completed" type="button" disabled>완료 항목 지우기</button>
    </div>
    <ul id="task-list" aria-label="Tasks"></ul>
    <footer>Your tasks stay in this browser.</footer>
  </main>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
